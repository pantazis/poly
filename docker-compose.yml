services:
  metrics-sqlite:
    image: coleifer/sqlite-web:latest
    container_name: oblm-metrics-sqlite
    command: ["sqlite_web", "/data/oblm/metrics.db", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    networks:
      - trading-net

  trading-bot:
    build: .
    container_name: liquidation-trading-bot
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=UTC
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  oblm-trainer:
    build: .
    container_name: oblm-trainer
    command:
      [
        "python",
        "/app/src/trading/oblm_v2.py",
        "--rolling-window",
        "10080",
        "--warmup-candles",
        "1",
        "--min-total-for-log",
        "1",
        "--trading-session-enabled",
        "false"
      ]
    depends_on:
      - metrics-sqlite
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - TZ=UTC
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  oblm-simulator:
    build: .
    container_name: oblm-simulator
    command:
      [
        "python",
        "-m",
        "src.trading.oblm_simulator",
        "--confidence-log-path",
        "/app/logs/oblm/confidence_winrate.log",
        "--trades-csv-path",
        "/app/logs/oblm/simulated_trades.csv",
        "--min-empirical-winrate",
        "65",
        "--poll-seconds",
        "10"
      ]
    depends_on:
      - oblm-trainer
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - TZ=UTC
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  trading-net:
    driver: bridge
