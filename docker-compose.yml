services:
  metrics-sqlite:
    image: coleifer/sqlite-web:latest
    container_name: oblm-metrics-sqlite
    restart: unless-stopped
    command: ["sqlite_web", "/data/oblm/metrics.db", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    networks:
      - trading-net

  oblm-trainer:
    build: .
    container_name: oblm-trainer
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "exec python /app/src/trading/oblm_v2.py --rolling-window 10080 --warmup-candles 1 --min-total-for-log 1 --trading-session-enabled false --cluster-rarity-z-threshold 2.2 --cluster-min-samples 12 --cluster-dynamic-threshold-enabled true --cluster-dynamic-recalibration-interval 100 --cluster-dynamic-window-sequences 1000 --cluster-dynamic-k 4 --cluster-dynamic-z-multiplier -0.5 --cluster-dynamic-sharpness 0.70 --cluster-local-winrate-threshold 0.85 --cluster-local-min-support 20 --cluster-local-distance-quantile 0.30"
      ]
    depends_on:
      - metrics-sqlite
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - TZ=UTC
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  oblm-simulator:
    build: .
    container_name: oblm-simulator
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "src.trading.oblm_simulator",
        "--confidence-log-path",
        "/app/logs/oblm/confidence_winrate.log",
        "--trades-csv-path",
        "/app/logs/oblm/simulated_trades.csv",
        "--min-confidence-winrate",
        "80",
        "--confidence-thresholds",
        "90,80,70,60,50,40,30,20,10",
        "--min-total-trades",
        "10",
        "--poll-seconds",
        "10"
      ]
    depends_on:
      - oblm-trainer
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - TZ=UTC
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  oblm-groups-page:
    build: .
    container_name: oblm-groups-page
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "src.trading.groups_leaderboard",
        "--model-path",
        "/app/data/oblm/model.pkl",
        "--host",
        "0.0.0.0",
        "--port",
        "8090",
        "--default-min-support",
        "1"
      ]
    depends_on:
      - oblm-trainer
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - TZ=UTC
    ports:
      - "8090:8090"
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  trading-net:
    driver: bridge
