version: '3.8'

services:
  trading-bot:
    build: .
    container_name: liquidation-trading-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=UTC
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  oblm-trainer:
    build: .
    container_name: oblm-trainer
    restart: unless-stopped
    command: ["python", "-m", "src.trading.oblm"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - TZ=UTC
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  trading-net:
    driver: bridge
