version: '3.8'

services:
  oblm-trainer:
    build: .
    container_name: oblm-trainer
    restart: unless-stopped
    command: ["python", "/app/src/trading/oblm_v2.py"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - TZ=UTC
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  trading-net:
    driver: bridge
